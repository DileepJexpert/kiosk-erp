name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiosk_erp_test
      NEXTAUTH_SECRET: test-secret-key-at-least-32-characters-long-1234
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Next.js Linter check
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run Vitest unit tests
        run: npm run test

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NODE_ENV: production
